name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run tests
        run: python -m pytest -q

  compose:
    name: Docker Compose build and smoke check
    runs-on: ubuntu-latest
    env:
      HOST_BIND_ADDRESS: 127.0.0.1
      INTERNAL_API_TOKEN: ci-only-internal-token
      DEVICE_AUTH_TOKEN: ci-only-device-token
      FACE_RECOGNITION_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build all service images
        run: docker compose --profile sim build

      - name: Start core services and wait for health checks
        run: docker compose up --detach --wait

      - name: Smoke check services and dashboard
        run: |
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent http://127.0.0.1:8001/health
          curl --fail --silent http://127.0.0.1:8002/health
          curl --fail --silent --output /tmp/dashboard.html http://127.0.0.1:8000/
          grep -q 'guest-registration-form' /tmp/dashboard.html
          curl --fail --silent http://127.0.0.1:8000/v1/lounge/roster

      - name: Verify OpenCV JPEG XL decode and frame intake in face-worker image
        run: |
          docker compose exec -T face-worker python -c 'import cv2, imagecodecs, numpy as np; from pathlib import Path; from vision import InsightFaceEngine; rgb=np.zeros((8, 10, 3), dtype=np.uint8); rgb[0, 0]=[11, 73, 201]; frame=imagecodecs.jpegxl_encode(rgb, lossless=True); info="\\n".join(line for line in cv2.getBuildInformation().splitlines() if "JPEG XL" in line); print(info or "JPEG XL missing from OpenCV build information"); decoded=cv2.imdecode(np.frombuffer(frame, dtype=np.uint8), cv2.IMREAD_COLOR); assert decoded is not None and decoded[0, 0].tolist() == [201, 73, 11]; vision_decoded=InsightFaceEngine._decode(frame, "image/jxl"); assert vision_decoded[0, 0].tolist() == [201, 73, 11]; Path("/tmp/ci-frame.jxl").write_bytes(frame)'
          docker compose cp face-worker:/tmp/ci-frame.jxl /tmp/ci-frame.jxl
          curl --fail --silent --show-error \
            -H "X-Internal-Token: ${INTERNAL_API_TOKEN}" \
            -H 'Content-Type: image/jxl' \
            -H 'X-Stream-Id: ci-jxl-stream' \
            -H 'X-Device-Id: ci-jxl-device' \
            -H "X-Captured-At: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --data-binary @/tmp/ci-frame.jxl \
            http://127.0.0.1:8001/internal/v1/frames

      - name: Stop services and remove test data
        if: always()
        run: docker compose down --volumes --remove-orphans
