<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
<title id="title">CONTEXTUAL RETRIEVAL PIPELINE</title><desc id="description">The proposed server pipeline combines guest identity with conversation context. Identity determines the guest record and context selects suitable preference fields. Only selected information returns to the glasses.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#192e35"/></marker></defs>
<rect x="1" y="1" width="1198" height="398" rx="12" fill="#f7f8fa" stroke="#d9dfd9"/>
<text x="22" y="34" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#2858ad" font-weight="700" text-anchor="start">CONTEXTUAL RETRIEVAL PIPELINE</text><rect x="254" y="63" width="926" height="247" rx="30" fill="#fafbfe" stroke="#2858ad" stroke-width="2.8"/><text x="717.0" y="90" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#192e35" font-weight="650" text-anchor="middle">Server</text><rect x="20" y="110" width="164" height="66" rx="33.0" fill="white" stroke="#159447" stroke-width="2.8"/><text x="102.0" y="149.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#192e35" font-weight="650" text-anchor="middle">Audio</text><rect x="20" y="252" width="184" height="66" rx="33.0" fill="white" stroke="#159447" stroke-width="2.8"/><text x="112.0" y="280.0" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#192e35" font-weight="650" text-anchor="middle">Display</text><text x="112.0" y="302.0" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#192e35" font-weight="650" text-anchor="middle">selected information</text><rect x="298" y="107" width="374" height="70" rx="35.0" fill="white" stroke="#159447" stroke-width="2.8"/><text x="485.0" y="137.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#192e35" font-weight="650" text-anchor="middle">Retrieve context of</text><text x="485.0" y="159.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#192e35" font-weight="650" text-anchor="middle">conversation</text><rect x="298" y="222" width="374" height="70" rx="35.0" fill="white" stroke="#2858ad" stroke-width="2.8"/><text x="485.0" y="252.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#192e35" font-weight="650" text-anchor="middle">Guest association with</text><text x="485.0" y="274.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#192e35" font-weight="650" text-anchor="middle">face recognition</text><rect x="810" y="157" width="340" height="112" rx="40" fill="white" stroke="#2858ad" stroke-width="2.8"/><text x="980.0" y="197.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#192e35" font-weight="650" text-anchor="middle">Retrieve selected</text><text x="980.0" y="219.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#192e35" font-weight="650" text-anchor="middle">guest preferences</text><text x="980.0" y="241.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#192e35" font-weight="650" text-anchor="middle">from database</text><path d="M187 143L292 143" fill="none" stroke="#192e35" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M675 142H980V151" fill="none" stroke="#192e35" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M675 257L804 229" fill="none" stroke="#192e35" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M807 257H742V333H112V324" fill="none" stroke="#192e35" stroke-width="2.8" marker-end="url(#arrow)"/><text x="22" y="373" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52646a" font-weight="400" text-anchor="start">Proposed contextual retrieval: identity chooses whose record; conversation context chooses which details.</text></svg>
