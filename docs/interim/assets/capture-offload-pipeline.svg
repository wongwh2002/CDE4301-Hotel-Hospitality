<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title description">
<title id="title">CAPTURE PIPELINE · PROCESSING ALLOCATION</title><desc id="description">Temple touch starts sensing on the glasses. Heavier multimodal processing, insight extraction, guest association and database writes are allocated to the server in the intended full pipeline. Recognition offloading is implemented; automatic preference extraction and updates remain under development.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#111d36"/></marker></defs>
<rect x="1" y="1" width="1198" height="258" rx="12" fill="#f7f9fd" stroke="#d9e0eb"/>
<text x="22" y="34" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#294d83" font-weight="700" text-anchor="start">CAPTURE PIPELINE · PROCESSING ALLOCATION</text><rect x="20" y="61" width="260" height="133" rx="30" fill="#fafbfe" stroke="#294d83" stroke-width="2.8"/><text x="150.0" y="88" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#111d36" font-weight="650" text-anchor="middle">Glasses</text><rect x="325" y="61" width="855" height="133" rx="30" fill="#fafbfe" stroke="#294d83" stroke-width="2.8"/><text x="752.5" y="88" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#111d36" font-weight="650" text-anchor="middle">Server</text><rect x="36" y="110" width="84" height="62" rx="31.0" fill="white" stroke="#294d83" stroke-width="2.8"/><text x="78.0" y="136.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#111d36" font-weight="650" text-anchor="middle">Temple</text><text x="78.0" y="158.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#111d36" font-weight="650" text-anchor="middle">touch</text><rect x="143" y="110" width="120" height="62" rx="31.0" fill="white" stroke="#294d83" stroke-width="2.8"/><text x="203.0" y="136.0" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#111d36" font-weight="650" text-anchor="middle">Video /</text><text x="203.0" y="158.0" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#111d36" font-weight="650" text-anchor="middle">audio</text><path d="M123 141L137 141" fill="none" stroke="#111d36" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="350" y="110" width="180" height="62" rx="31.0" fill="white" stroke="#294d83" stroke-width="2.8"/><text x="440.0" y="136.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#111d36" font-weight="650" text-anchor="middle">Multimodal</text><text x="440.0" y="158.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#111d36" font-weight="650" text-anchor="middle">processing</text><rect x="552" y="110" width="180" height="62" rx="31.0" fill="white" stroke="#294d83" stroke-width="2.8"/><text x="642.0" y="136.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#111d36" font-weight="650" text-anchor="middle">Extract relevant</text><text x="642.0" y="158.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#111d36" font-weight="650" text-anchor="middle">insights</text><rect x="754" y="110" width="180" height="62" rx="31.0" fill="white" stroke="#294d83" stroke-width="2.8"/><text x="844.0" y="125.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#111d36" font-weight="650" text-anchor="middle">Guest association</text><text x="844.0" y="147.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#111d36" font-weight="650" text-anchor="middle">with face</text><text x="844.0" y="169.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#111d36" font-weight="650" text-anchor="middle">recognition</text><rect x="956" y="110" width="200" height="62" rx="31.0" fill="white" stroke="#294d83" stroke-width="2.8"/><text x="1056.0" y="125.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#111d36" font-weight="650" text-anchor="middle">Record guest</text><text x="1056.0" y="147.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#111d36" font-weight="650" text-anchor="middle">preferences in</text><text x="1056.0" y="169.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#111d36" font-weight="650" text-anchor="middle">database</text><path d="M266 141L344 141" fill="none" stroke="#111d36" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M533 141L546 141" fill="none" stroke="#111d36" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M735 141L748 141" fill="none" stroke="#111d36" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M937 141L950 141" fill="none" stroke="#111d36" stroke-width="2.8" marker-end="url(#arrow)"/><text x="22" y="235" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#59677f" font-weight="400" text-anchor="start">Quick sensing and display stay local; heavier recognition, extraction and record handling belong on the server.</text></svg>
