<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="415" viewBox="0 0 1200 415" role="img" aria-labelledby="title description">
<title id="title">Activate for the encounter; stop after silence</title><desc id="description">Before, camera and face analysis continue between encounters. After, a temple tap starts an active session. Speech resets a 15-second silence timer. Fifteen seconds without speech stops capture, clears the cues and returns to idle.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#176b5b"/></marker></defs>
<rect x="1" y="1" width="1198" height="413" rx="14" fill="#fbfcf8" stroke="#d9dfd9"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="34" font-size="12" fill="#176b5b" font-weight="700" text-anchor="start">DESIGN ITERATION</text><text x="28" y="77" font-size="28" fill="#192e35" font-weight="400" text-anchor="start">Activate for the encounter; stop after silence</text><rect x="28" y="110" width="1144" height="55" rx="12" fill="#f5eedf" stroke="#e0d3b7"/><text x="48" y="145" font-size="19" fill="#785024" font-weight="550" text-anchor="start">Before: camera and face analysis remain active between guest encounters</text><rect x="28" y="225" width="250" height="100" rx="12" fill="#ffffff" stroke="#bdcbbf"/><text x="50" y="261" font-size="21" fill="#192e35" font-weight="650" text-anchor="start">Idle</text><text x="50" y="300" font-size="18" fill="#52646a" font-weight="400" text-anchor="start">Camera + microphone off</text><rect x="420" y="225" width="350" height="100" rx="12" fill="#e8efe7" stroke="#bdcbbf"/><text x="442" y="261" font-size="21" fill="#192e35" font-weight="650" text-anchor="start">Active encounter</text><text x="442" y="300" font-size="18" fill="#52646a" font-weight="400" text-anchor="start">Capture, recognise and show cues</text><rect x="922" y="225" width="250" height="100" rx="12" fill="#ffffff" stroke="#bdcbbf"/><text x="944" y="261" font-size="21" fill="#192e35" font-weight="650" text-anchor="start">Stop + clear cues</text><text x="944" y="300" font-size="18" fill="#52646a" font-weight="400" text-anchor="start">Return to the idle state</text><path d="M286 275L412 275" fill="none" stroke="#176b5b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="349" y="253" font-size="16" fill="#176b5b" font-weight="500" text-anchor="middle">Temple tap</text><path d="M778 275L914 275" fill="none" stroke="#176b5b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="846" y="251" font-size="15" fill="#176b5b" font-weight="500" text-anchor="middle">15 s without speech</text><path d="M680 225V193H510V217" fill="none" stroke="#176b5b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="595" y="185" font-size="15" fill="#176b5b" font-weight="500" text-anchor="middle">Speech resets the silence timer</text><text x="28" y="379" font-size="17" fill="#52646a" font-weight="400" text-anchor="start">Short pauses need no extra tap. Speech extends an active session; it cannot start an idle one.</text></g></svg>
