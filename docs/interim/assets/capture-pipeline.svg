<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="245" viewBox="0 0 1200 245" role="img" aria-labelledby="title description">
<title id="title">CAPTURE PIPELINE</title><desc id="description">The intended capture workflow passes a video/audio clip through multimodal processing and insight extraction, associates the evidence with a guest using face recognition, then records guest preferences in the database.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#111d36"/></marker></defs>
<rect x="1" y="1" width="1198" height="243" rx="12" fill="#f7f9fd" stroke="#d9e0eb"/>
<text x="22" y="34" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#294d83" font-weight="700" text-anchor="start">CAPTURE PIPELINE</text><rect x="20" y="80" width="208" height="102" rx="40" fill="white" stroke="#294d83" stroke-width="2.8"/><text x="124.0" y="126.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#111d36" font-weight="650" text-anchor="middle">Video / audio</text><text x="124.0" y="148.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#111d36" font-weight="650" text-anchor="middle">clip</text><path d="M231 131L250 131" fill="none" stroke="#111d36" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="258" y="80" width="208" height="102" rx="40" fill="white" stroke="#294d83" stroke-width="2.8"/><text x="362.0" y="126.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#111d36" font-weight="650" text-anchor="middle">Multimodal</text><text x="362.0" y="148.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#111d36" font-weight="650" text-anchor="middle">processing</text><path d="M469 131L488 131" fill="none" stroke="#111d36" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="496" y="80" width="208" height="102" rx="40" fill="white" stroke="#294d83" stroke-width="2.8"/><text x="600.0" y="126.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#111d36" font-weight="650" text-anchor="middle">Extract relevant</text><text x="600.0" y="148.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#111d36" font-weight="650" text-anchor="middle">insights</text><path d="M707 131L726 131" fill="none" stroke="#111d36" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="734" y="80" width="208" height="102" rx="40" fill="white" stroke="#294d83" stroke-width="2.8"/><text x="838.0" y="115.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#111d36" font-weight="650" text-anchor="middle">Guest association</text><text x="838.0" y="137.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#111d36" font-weight="650" text-anchor="middle">with face</text><text x="838.0" y="159.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#111d36" font-weight="650" text-anchor="middle">recognition</text><path d="M945 131L964 131" fill="none" stroke="#111d36" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="972" y="80" width="208" height="102" rx="40" fill="white" stroke="#294d83" stroke-width="2.8"/><text x="1076.0" y="115.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#111d36" font-weight="650" text-anchor="middle">Record guest</text><text x="1076.0" y="137.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#111d36" font-weight="650" text-anchor="middle">preferences in</text><text x="1076.0" y="159.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#111d36" font-weight="650" text-anchor="middle">database</text><text x="22" y="220" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#59677f" font-weight="400" text-anchor="start">Target workflow: captured interaction → supported guest insight → shared record.</text></svg>
