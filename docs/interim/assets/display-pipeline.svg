<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="328" viewBox="0 0 1200 328" role="img" aria-labelledby="title description">
<title id="title">DISPLAY PIPELINE</title><desc id="description">Glasses capture an image during an activated encounter. The server associates a guest using face recognition and retrieves their preferences. The result returns to the glasses for display. Local face-position tracking is introduced in the placement iteration.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#192e35"/></marker></defs>
<rect x="1" y="1" width="1198" height="326" rx="12" fill="#f7f8fa" stroke="#d9dfd9"/>
<text x="22" y="34" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#2858ad" font-weight="700" text-anchor="start">DISPLAY PIPELINE</text><rect x="20" y="61" width="486" height="164" rx="30" fill="#fafbfe" stroke="#2858ad" stroke-width="2.8"/><text x="263.0" y="88" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#192e35" font-weight="650" text-anchor="middle">Glasses</text><rect x="554" y="61" width="626" height="164" rx="30" fill="#fafbfe" stroke="#2858ad" stroke-width="2.8"/><text x="867.0" y="88" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#192e35" font-weight="650" text-anchor="middle">Server</text><rect x="40" y="115" width="140" height="76" rx="38.0" fill="white" stroke="#2858ad" stroke-width="2.8"/><text x="110.0" y="148.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#192e35" font-weight="650" text-anchor="middle">Display</text><text x="110.0" y="170.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#192e35" font-weight="650" text-anchor="middle">information</text><rect x="211" y="115" width="112" height="76" rx="38.0" fill="white" stroke="#2858ad" stroke-width="2.8"/><text x="267.0" y="148.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#192e35" font-weight="650" text-anchor="middle">Temple</text><text x="267.0" y="170.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#192e35" font-weight="650" text-anchor="middle">touch</text><rect x="354" y="115" width="132" height="76" rx="38.0" fill="white" stroke="#2858ad" stroke-width="2.8"/><text x="420.0" y="148.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#192e35" font-weight="650" text-anchor="middle">Video /</text><text x="420.0" y="170.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#192e35" font-weight="650" text-anchor="middle">audio</text><rect x="577" y="115" width="246" height="76" rx="38.0" fill="white" stroke="#2858ad" stroke-width="2.8"/><text x="700.0" y="148.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#192e35" font-weight="650" text-anchor="middle">Guest association</text><text x="700.0" y="170.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#192e35" font-weight="650" text-anchor="middle">with face recognition</text><rect x="858" y="115" width="297" height="76" rx="38.0" fill="white" stroke="#2858ad" stroke-width="2.8"/><text x="1006.5" y="148.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#192e35" font-weight="650" text-anchor="middle">Retrieve guest preferences</text><text x="1006.5" y="170.0" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#192e35" font-weight="650" text-anchor="middle">from database</text><path d="M326 153L348 153" fill="none" stroke="#192e35" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M489 153L571 153" fill="none" stroke="#192e35" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M826 153L852 153" fill="none" stroke="#192e35" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M1006 194V262H110V199" fill="none" stroke="#192e35" stroke-width="2.8" marker-end="url(#arrow)"/><text x="22" y="302" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52646a" font-weight="400" text-anchor="start">Identity selects the guest record; returned information must still be associated with the correct person.</text></svg>
