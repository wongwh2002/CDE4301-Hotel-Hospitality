<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="446" viewBox="0 0 1200 446" role="img" aria-labelledby="title description">
<title id="title">Select what matters for this service task</title><desc id="description">The proposed contextual filter selects a drink preference for a drinks encounter, withholds an unrelated room preference and preserves a separate safety-warning priority. This ranking is a planned iteration rather than an implemented conversation classifier.</desc>
