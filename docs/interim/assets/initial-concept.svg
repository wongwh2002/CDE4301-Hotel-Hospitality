<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="505" viewBox="0 0 1200 505" role="img" aria-labelledby="title description">
<title id="title">Core functions behind the staff experience</title><desc id="description">In the initial concept the camera stays on 24/7 and captures and analyses every frame. Local detection locates and tracks faces. InsightFace buffalo_l matches live face vectors against cached 512-number ArcFace reference vectors. The recognised identity selects a SQLite guest record, which returns name and preference cues directly to the wearer interface.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#173b73"/></marker></defs>
<rect x="1" y="1" width="1198" height="503" rx="14" fill="#fbfcff" stroke="#d9e0eb"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="34" font-size="12" fill="#173b73" font-weight="700" text-anchor="start">SOLUTION OVERVIEW · FUNCTIONS AND TECHNOLOGY</text><text x="28" y="77" font-size="28" fill="#111d36" font-weight="400" text-anchor="start">Core functions behind the staff experience</text><rect x="28" y="116" width="344" height="239" rx="12" fill="#e8eef7" stroke="#c7d2e3"/><text x="50" y="152" font-size="21" fill="#111d36" font-weight="650" text-anchor="start">Wearer interface</text><text x="50" y="191" font-size="18" fill="#59677f" font-weight="400" text-anchor="start">Initial camera: on 24/7</text><text x="50" y="221" font-size="18" fill="#59677f" font-weight="400" text-anchor="start">Capture: analyse every frame</text><text x="50" y="251" font-size="18" fill="#59677f" font-weight="400" text-anchor="start">Display: name + service cue</text><rect x="428" y="116" width="344" height="239" rx="12" fill="#ffffff" stroke="#c7d2e3"/><text x="450" y="152" font-size="21" fill="#111d36" font-weight="650" text-anchor="start">Guest recognition</text><text x="450" y="191" font-size="18" fill="#59677f" font-weight="400" text-anchor="start">InsightFace buffalo_l</text><text x="450" y="221" font-size="18" fill="#59677f" font-weight="400" text-anchor="start">SCRFD: face + landmarks</text><text x="450" y="251" font-size="18" fill="#59677f" font-weight="400" text-anchor="start">ArcFace: 512-number face vectors</text><text x="450" y="281" font-size="18" fill="#59677f" font-weight="400" text-anchor="start">Reference vectors cached in RAM</text><rect x="828" y="116" width="344" height="239" rx="12" fill="#ffffff" stroke="#c7d2e3"/><text x="850" y="152" font-size="20" fill="#111d36" font-weight="650" text-anchor="start">Shared guest records</text><text x="850" y="191" font-size="18" fill="#59677f" font-weight="400" text-anchor="start">SQLite: profiles + preferences</text><text x="850" y="221" font-size="18" fill="#59677f" font-weight="400" text-anchor="start">Guest · preference · source · time</text><text x="850" y="251" font-size="18" fill="#59677f" font-weight="400" text-anchor="start">Shared context for staff display</text><path d="M380 233L420 233" fill="none" stroke="#173b73" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M780 212L820 212" fill="none" stroke="#173b73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="50" y="328" font-size="16" fill="#173b73" font-weight="650" text-anchor="start">Capture and analyse every frame</text><path d="M1000 355V394H200V363" fill="none" stroke="#173b73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="325" y="377" width="557" height="34" rx="6" fill="#e8eef7" stroke="#e8eef7"/><text x="604" y="400" font-size="16" fill="#173b73" font-weight="500" text-anchor="middle">Guest record → name + preference cues on the glasses</text><text x="28" y="450" font-size="16" fill="#59677f" font-weight="400" text-anchor="start">Record context: guest · item · preference/dislike/allergy · source · update time</text><text x="28" y="486" font-size="13" fill="#59677f" font-weight="400" text-anchor="start">Core functions shown. Activity gating and the move from local to laptop recognition are explained in the following iterations.</text></g></svg>
