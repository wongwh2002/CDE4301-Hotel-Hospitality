<title id="title">Replace reading with a compact service cue</title><desc id="description">A schematic text display for a fictional demo guest is compared with the implemented coffee preference and shellfish warning icons. A heart means preference and a warning marker means a fictional demo allergy. Icons reduce visible text but do not establish unaided comprehension.</desc>
