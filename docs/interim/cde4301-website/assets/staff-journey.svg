<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title description">
<title id="title">Intended staff journey for personalised service</title>
<desc id="description">The intended solution journey has five normal steps: approach the guest, see useful context, adapt the offer, confirm and listen, then Update Preference: Update database shared with all employees.</desc>
