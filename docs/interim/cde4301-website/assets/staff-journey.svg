<text x="28" y="76" font-family="Georgia,serif" font-size="29">Useful context should lead to a fitting service action</text>
<g fill="#ffffff" stroke="#c7d2e3"><rect x="28" y="109" width="210" height="185" rx="10"/><rect x="261" y="109" width="210" height="185" rx="10"/><rect x="494" y="109" width="210" height="185" rx="10"/><rect x="727" y="109" width="210" height="185" rx="10"/></g>
