<g font-size="15" font-weight="700" text-anchor="middle" fill="#173b73"><text x="56" y="144">1</text><text x="289" y="144">2</text><text x="522" y="144">3</text><text x="755" y="144">4</text><text x="988" y="144">5</text></g>
<g font-size="19" font-weight="650"><text x="45" y="184">Approach the guest</text><text x="278" y="184">See useful context</text><text x="511" y="184">Adapt the offer</text><text x="744" y="184">Confirm and listen</text><text x="977" y="184">Update Preference</text></g>
<g font-size="17" fill="#59677f">
<text x="45" y="219"><tspan x="45">Begin a normal</tspan><tspan x="45" dy="25">service encounter.</tspan></text>
<text x="278" y="219"><tspan x="278">Name and a known</tspan><tspan x="278" dy="25">preference appear.</tspan></text>
<text x="511" y="219"><tspan x="511">“Would you like</tspan><tspan x="511" dy="25">oat milk again?”</tspan></text>
<text x="744" y="219"><tspan x="744">Check today's choice;</tspan><tspan x="744" dy="25">hear new requests.</tspan></text>
<text x="977" y="219"><tspan x="977">Update database</tspan><tspan x="977" dy="25">shared with all</tspan><tspan x="977" dy="25">employees</tspan></text>
</g>
<text x="28" y="328" font-size="13" fill="#59677f">Intended solution journey: use current guest context, confirm the need, and update shared knowledge for the next encounter.</text>
