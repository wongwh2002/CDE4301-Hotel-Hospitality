<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="448" viewBox="0 0 1200 448" role="img" aria-labelledby="title description">
<title id="title">Move information towards the guest interaction area</title><desc id="description">A schematic compares a fixed cue positioned away from a guest with a cue placed beside the selected face. The intended benefit is a clearer person-to-context association with less need to look away. This is a design explanation, not measured gaze data.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#176b5b"/></marker></defs>
<rect x="1" y="1" width="1198" height="446" rx="14" fill="#fbfcf8" stroke="#d9dfd9"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="34" font-size="12" fill="#176b5b" font-weight="700" text-anchor="start">DESIGN ITERATION</text><text x="28" y="77" font-size="28" fill="#192e35" font-weight="400" text-anchor="start">Move information towards the guest interaction area</text><rect x="28" y="110" width="548" height="266" rx="12" fill="#ffffff" stroke="#bdcbbf"/><rect x="624" y="110" width="548" height="266" rx="12" fill="#e8efe7" stroke="#bdcbbf"/><text x="48" y="144" font-size="20" fill="#192e35" font-weight="650" text-anchor="start">Fixed cue: separate viewing area</text><text x="644" y="144" font-size="20" fill="#192e35" font-weight="650" text-anchor="start">Face-relative cue: context stays nearby</text><g fill="none" stroke="#52646a" stroke-width="3"><circle cx="388" cy="228" r="29"/><path d="M335 326v-25q0-37 53-37t53 37v25"/></g><g fill="none" stroke="#52646a" stroke-width="3"><circle cx="808" cy="228" r="29"/><path d="M755 326v-25q0-37 53-37t53 37v25"/></g><rect x="51" y="189" width="229" height="77" rx="12" fill="#edf1eb" stroke="#bdcbbf"/><text x="68" y="217" font-size="18" fill="#52646a" font-weight="400" text-anchor="start">Guest name</text><text x="68" y="244" font-size="18" fill="#52646a" font-weight="400" text-anchor="start">Coffee preference</text><path d="M285 217q30-40 63-3" fill="none" stroke="#8b754c" stroke-width="2" stroke-dasharray="5 5"/><rect x="891" y="190" width="256" height="77" rx="12" fill="#ffffff" stroke="#bdcbbf"/><text x="909" y="218" font-size="18" fill="#52646a" font-weight="400" text-anchor="start">Guest name</text><text x="909" y="245" font-size="18" fill="#52646a" font-weight="400" text-anchor="start">Coffee preference</text><text x="48" y="352" font-size="16" fill="#52646a" font-weight="400" text-anchor="start">Cue and person occupy separate areas</text><text x="644" y="352" font-size="16" fill="#52646a" font-weight="400" text-anchor="start">Place beside the face; avoid covering it</text><text x="28" y="415" font-size="16" fill="#52646a" font-weight="400" text-anchor="start">Placement rationale illustrated; maintained eye contact and distraction still require user evaluation.</text></g></svg>
