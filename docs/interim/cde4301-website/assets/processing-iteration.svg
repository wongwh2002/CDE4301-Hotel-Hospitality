<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title description">
<title id="title">Keep position updates local; offload identity recognition</title><desc id="description">The early design places the recognition workload on the glasses. The refined design keeps local position tracking on the glasses, sends face images to the laptop for SCRFD and ArcFace recognition and profile retrieval, then returns identity and cues to render locally. Preference extraction is evaluated as a separate workstream.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#176b5b"/></marker></defs>
<rect x="1" y="1" width="1198" height="448" rx="14" fill="#fbfcf8" stroke="#d9dfd9"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="34" font-size="12" fill="#176b5b" font-weight="700" text-anchor="start">DESIGN ITERATION</text><text x="28" y="77" font-size="28" fill="#192e35" font-weight="400" text-anchor="start">Keep position updates local; offload identity recognition</text><rect x="28" y="111" width="1144" height="94" rx="12" fill="#f5eedf" stroke="#bdcbbf"/><text x="50" y="147" font-size="21" fill="#192e35" font-weight="650" text-anchor="start">Before: recognition stays on the glasses</text><text x="50" y="186" font-size="18" fill="#52646a" font-weight="400" text-anchor="start">Camera + tracking + identity inference + display share limited device resources</text><rect x="28" y="239" width="290" height="125" rx="12" fill="#e8efe7" stroke="#bdcbbf"/><text x="50" y="275" font-size="21" fill="#192e35" font-weight="650" text-anchor="start">Glasses</text><text x="50" y="314" font-size="18" fill="#52646a" font-weight="400" text-anchor="start">Track the selected face</text><text x="50" y="344" font-size="18" fill="#52646a" font-weight="400" text-anchor="start">Prepare a face image</text><rect x="439" y="239" width="335" height="125" rx="12" fill="#ffffff" stroke="#bdcbbf"/><text x="461" y="275" font-size="21" fill="#192e35" font-weight="650" text-anchor="start">Laptop</text><text x="461" y="314" font-size="18" fill="#52646a" font-weight="400" text-anchor="start">SCRFD + ArcFace recognition</text><text x="461" y="344" font-size="18" fill="#52646a" font-weight="400" text-anchor="start">Retrieve guest context</text><rect x="917" y="239" width="255" height="125" rx="12" fill="#e8efe7" stroke="#bdcbbf"/><text x="939" y="275" font-size="21" fill="#192e35" font-weight="650" text-anchor="start">Glasses</text><text x="939" y="314" font-size="18" fill="#52646a" font-weight="400" text-anchor="start">Keep tracking locally</text><text x="939" y="344" font-size="18" fill="#52646a" font-weight="400" text-anchor="start">Render name + cues</text><path d="M326 297L431 297" fill="none" stroke="#176b5b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="378" y="273" font-size="15" fill="#176b5b" font-weight="500" text-anchor="middle">Face image</text><path d="M782 297L909 297" fill="none" stroke="#176b5b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="845" y="273" font-size="15" fill="#176b5b" font-weight="500" text-anchor="middle">Identity + cues</text><text x="28" y="414" font-size="17" fill="#52646a" font-weight="400" text-anchor="start">Extraction workstream: guest statement → transcript → structured draft → review → shared preference</text></g></svg>
